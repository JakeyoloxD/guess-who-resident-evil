<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dead by Daylight Guess Who</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Dead by Daylight Guess Who</h1>

<div class="grid">
  
  
  <div class="card"><img src="./assets/images/Jill_Valentine.png" alt="Jill Valentine"><p>Jill Valentine</p></div>  
  <div class="card"><img src="./assets/images/Leon_S._Kennedy.png" alt="Leon S. Kennedy"><p>Leon S. Kennedy</p></div>  
  <div class="card"><img src="./assets/images/Ada_Wong.png" alt="Ada Wong"><p>Ada Wong</p></div>  
  <div class="card"><img src="./assets/images/Rebecca_Chambers.png" alt="Rebecca Chambers"><p>Rebecca Chambers</p></div>  
  <div class="card"><img src="./assets/images/Nemesis.png" alt="Nemesis"><p>Nemesis</p></div>
  <div class="card"><img src="./assets/images/Mastermind_(Albert_Wesker).png" alt="Mastermind (Albert Wesker)"><p>Wesker</p></div>   

</div>

<div class="buttons">
    <button onclick="resetGrid()">Reset Board</button>
    <button onclick="generateCharacter()">Generate Random Character</button>
</div>
<div id="random-character" style="margin-top: 20px; font-size: 1.5em; font-weight: bold; color: #ff3333;"></div>

<script src="script.js"></script>

</body>
</html>
